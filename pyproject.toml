[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao"
version = "0.1.0"
description = "Monte Carlo simulator for the Campeonato Brasileiro Série A, with a Poisson goals model and an interactive dashboard."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "streamlit>=1.37",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brasileirao = "brasileirao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
